name: Build & Publish Signed Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Split APKs & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Signed Release Split APKs
        env:
          RELEASE_KEYSTORE_FILE: app/release-keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          echo "Generated APK files in app/build/outputs/apk/release/:"
          ls -lah app/build/outputs/apk/release/

      - name: Extract Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "App Lock ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version.json & Upload Split APKs to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ steps.vars.outputs.tag }}
          R2_PUBLIC_URL: "https://pub-3efdf98689b640149aa277ccc5daea43.r2.dev"
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "Skipping Cloudflare R2 upload: one or more R2_* secrets are not configured."
            exit 0
          fi

          export VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          export VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          export RELEASE_NOTES=$(git log -1 --pretty=%s)

          python3 -c '
          import json, os
          tag = os.environ["TAG"]
          base = os.environ["R2_PUBLIC_URL"]
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "tag": tag,
              "releaseNotes": os.environ["RELEASE_NOTES"],
              "apks": {
                  "arm64-v8a": f"{base}/releases/{tag}/app-arm64-v8a-release.apk",
                  "armeabi-v7a": f"{base}/releases/{tag}/app-armeabi-v7a-release.apk",
                  "x86_64": f"{base}/releases/{tag}/app-x86_64-release.apk",
                  "universal": f"{base}/releases/{tag}/app-universal-release.apk",
              },
          }
          with open("version.json", "w") as f:
              json.dump(data, f, indent=2)
          '

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp app/build/outputs/apk/release/ "s3://${R2_BUCKET_NAME}/releases/${TAG}/" \
            --recursive --exclude "*" --include "*.apk" --endpoint-url "${ENDPOINT}"
          aws s3 cp version.json "s3://${R2_BUCKET_NAME}/version.json" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0" \
            --endpoint-url "${ENDPOINT}"
